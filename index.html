<script>
        const BACKEND_URL = "https://pool-tickets-backend.onrender.com";
        const TEAM_TELEGRAM_WALLET = "0x55eBD04b0dBE226b69ECf046B72fAe043e4dcaCd";
        const USDT_BSC_CONTRACT = "0x55d398326f99059fF775485246999027B3197955";

        const projectId = '2d927cdc93b12c7b9608d37eebba7dd9';
        const bscChain = {
            chainId: 56,
            name: 'Binance Smart Chain',
            currency: 'BNB',
            explorerUrl: 'https://bscscan.com',
            rpcUrl: 'https://bsc-dataseed.binance.org'
        };

        let modal = null;

        // Fonction d'initialisation à la demande (au clic) pour éviter tout blocage réseau initial
        function getOrCreateModal() {
            if (modal) return modal;
            try {
                if (typeof Web3Modal !== 'undefined' && Web3Modal.createWeb3Modal) {
                    modal = Web3Modal.createWeb3Modal({
                        ethersConfig: Web3Modal.defaultConfig({
                            metadata: {
                                name: 'Pool Tickets',
                                description: 'Web3 Grand Prize Protocol',
                                url: 'https://t.me/',
                                icons: []
                            }
                        }),
                        chains: [bscChain],
                        projectId: projectId,
                        themeMode: 'dark',
                        themeVariables: { '--w3m-color-mix': '#00f3ff', '--w3m-accent': '#00f3ff' }
                    });
                }
            } catch (e) {
                console.error("Erreur init Web3Modal:", e);
            }
            return modal;
        }

        const sampleEnglishFeeds = [
            "⚡ <span class='blur-user'>@cybervip</span> minted 5 tickets for 400 Stars!",
            "💎 New contribution from <span class='blur-user'>@cryptong</span> (3 tickets - 240 Stars)",
            "🚀 <span class='blur-user'>@wh07</span> minted 2 tickets for 160 Stars!",
            "⚡ <span class='blur-user'>@sat99</span> minted 4 tickets for 320 Stars!",
            "🔥 <span class='blur-user'>@ton55</span> minted 10 tickets for 800 Stars!",
            "⭐ <span class='blur-user'>@vip21</span> minted 8 tickets via Stars (640 Stars)!"
        ];

        function rotateLiveFeed() {
            const feedElement = document.getElementById('depositFeedText');
            if (feedElement) {
                const randomMsg = sampleEnglishFeeds[Math.floor(Math.random() * sampleEnglishFeeds.length)];
                feedElement.innerHTML = randomMsg;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetch(`${BACKEND_URL}/api/state`).catch(e => console.log("Wake up ping sent"));

            const savedWallet = localStorage.getItem('pool_tickets_payout_wallet');
            if (savedWallet) {
                document.getElementById('userPayoutWalletInput').value = savedWallet;
                document.getElementById('walletSavedBadge').style.display = 'inline';
            }

            // Met directement un message de statut propre et accueillant
            const statusEl = document.getElementById('cryptoPayStatus');
            if (statusEl) {
                statusEl.style.color = "var(--green)";
                statusEl.innerText = "Ready for 1-Click USDT Payment";
            }

            setInterval(rotateLiveFeed, 6000);
            syncAmount();
            syncCryptoAmount();
        });

        function switchPaymentTab(tab) {
            const tabStars = document.getElementById('tabStarsBtn');
            const tabWallet = document.getElementById('tabWalletBtn');
            const paneStars = document.getElementById('paneStars');
            const paneWallet = document.getElementById('paneWallet');

            if (tab === 'stars') {
                tabStars.classList.add('active');
                tabWallet.classList.remove('active');
                paneStars.classList.add('active');
                paneWallet.classList.remove('active');
            } else {
                tabWallet.classList.add('active');
                tabStars.classList.remove('active');
                paneWallet.classList.add('active');
                paneStars.classList.remove('active');
            }
        }

        async function savePayoutWalletAndScroll() {
            const walletInput = document.getElementById('userPayoutWalletInput');
            const statusText = document.getElementById('payoutSaveStatus');
            const badge = document.getElementById('walletSavedBadge');
            const address = walletInput.value.trim();

            if (!address || address.length < 15) {
                statusText.style.color = "var(--red)";
                statusText.innerText = "⚠️ Please enter a valid wallet address.";
                return;
            }

            localStorage.setItem('pool_tickets_payout_wallet', address);

            try {
                const userId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || "100001";
                await fetch(`${BACKEND_URL}/api/save-wallet`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, address: address })
                });
            } catch (e) {
                console.error("Erreur sauvegarde serveur:", e);
            }

            badge.style.display = 'inline';
            statusText.style.color = "var(--green)";
            statusText.innerText = "✅ Payout wallet locked! Scrolling to payment...";

            setTimeout(() => {
                const gateway = document.getElementById('paymentGatewaySection');
                if (gateway) {
                    gateway.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 350);
        }

        function syncAmount() {
            const val = parseInt(document.getElementById('usdtAmountInput').value) || 80;
            const starsAmount = Math.max(80, Math.ceil(val / 80) * 80);
            document.getElementById('usdtAmountInput').value = starsAmount;
            document.getElementById('btnAmountLabel').innerText = starsAmount;
            document.getElementById('btnTicketLabel').innerText = Math.max(1, starsAmount / 80);
        }

        function syncCryptoAmount() {
            const val = parseInt(document.getElementById('cryptoAmountInput').value) || 1;
            const amount = Math.max(1, val);
            document.getElementById('cryptoAmountInput').value = amount;
            document.getElementById('sdkBtnAmount').innerText = amount;
        }

        async function processPayment() {
            const userId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || "100001";
            const starsAmount = parseInt(document.getElementById('usdtAmountInput').value) || 80;
            const payoutWallet = document.getElementById('userPayoutWalletInput').value.trim();
            const payStatus = document.getElementById('payStatus');

            if (!payoutWallet) {
                payStatus.style.color = "var(--red)";
                payStatus.innerText = "⚠️ Please save your payout wallet first!";
                document.getElementById('payoutWalletCard').scrollIntoView({ behavior: 'smooth' });
                return;
            }

            payStatus.style.color = "var(--gold)";
            payStatus.innerText = "⏳ Generating Telegram Stars Invoice...";

            try {
                const response = await fetch(`${BACKEND_URL}/api/create-stars-invoice`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        stars_amount: starsAmount,
                        payout_address: payoutWallet
                    })
                });

                const data = await response.json();
                if (data.ok && data.invoice_link) {
                    payStatus.innerText = "✅ Invoice ready! Opening payment...";
                    if (window.Telegram && window.Telegram.WebApp) {
                        window.Telegram.WebApp.openInvoice(data.invoice_link, async (status) => {
                            if (status === 'paid') {
                                payStatus.style.color = "var(--green)";
                                payStatus.innerText = "🎉 Payment successful! Tickets added.";
                                setTimeout(() => location.reload(), 2000);
                            } else {
                                payStatus.style.color = "var(--muted)";
                                payStatus.innerText = "Payment cancelled or pending.";
                            }
                        });
                    } else {
                        window.open(data.invoice_link, '_blank');
                    }
                } else {
                    payStatus.style.color = "var(--red)";
                    payStatus.innerText = "Error: " + (data.error || "Could not create invoice");
                }
            } catch (e) {
                payStatus.style.color = "var(--red)";
                payStatus.innerText = "Network error while generating invoice.";
            }
        }

        async function processSdkPayment() {
            const userId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || "100001";
            const amountUsdt = parseInt(document.getElementById('cryptoAmountInput').value) || 1;
            const payoutWallet = document.getElementById('userPayoutWalletInput').value.trim();
            const statusDiv = document.getElementById('cryptoPayStatus');

            if (!payoutWallet) {
                statusDiv.style.color = "var(--red)";
                statusDiv.innerText = "⚠️ Please save your payout wallet first!";
                document.getElementById('payoutWalletCard').scrollIntoView({ behavior: 'smooth' });
                return;
            }

            const activeModal = getOrCreateModal();
            if (!activeModal) {
                statusDiv.style.color = "var(--red)";
                statusDiv.innerText = "⚠️ Web3Modal failed to load. Check your connection.";
                return;
            }

            try {
                statusDiv.style.color = "var(--gold)";
                statusDiv.innerText = "⏳ Opening wallet selector...";
                
                await activeModal.open();
                
                const walletProvider = activeModal.getWalletProvider();
                if (!walletProvider) {
                    statusDiv.innerText = "Selection cancelled.";
                    return;
                }

                const ethersProvider = new ethers.BrowserProvider(walletProvider);
                const signer = await ethersProvider.getSigner();

                statusDiv.innerText = "⏳ Preparing USDT transfer...";

                const erc20Abi = ["function transfer(address to, uint256 value) public returns (bool)"];
                const usdtContract = new ethers.Contract(USDT_BSC_CONTRACT, erc20Abi, signer);

                statusDiv.innerText = "⏳ Please confirm transfer in your wallet...";
                const parsedAmount = ethers.parseUnits(amountUsdt.toString(), 18);
                const tx = await usdtContract.transfer(TEAM_TELEGRAM_WALLET, parsedAmount);

                statusDiv.style.color = "var(--green)";
                statusDiv.innerText = "✅ Transaction sent! Verifying automatically...";

                const response = await fetch(`${BACKEND_URL}/api/verify-tx`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        tx_hash: tx.hash,
                        payout_address: payoutWallet
                    })
                });

                const data = await response.json();
                if (data.ok) {
                    statusDiv.style.color = "var(--green)";
                    statusDiv.innerText = "🎉 Success! Tickets credited to your account.";
                    setTimeout(() => location.reload(), 2000);
                } else {
                    statusDiv.style.color = "var(--gold)";
                    statusDiv.innerText = "⚠️ TX sent, verification pending on backend.";
                }

            } catch (err) {
                console.error(err);
                statusDiv.style.color = "var(--red)";
                statusDiv.innerText = "⚠️ Payment cancelled or failed.";
            }
        }
    </script>
