<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pool Tickets | Cyber Core</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05050a;
            --card-bg: rgba(13, 15, 28, 0.75);
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff007f;
            --neon-green: #00ff66;
            --text-main: #f0f2f5;
            --text-muted: #8b9bb4;
            --border-cyber: rgba(0, 240, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 127, 0.05) 0%, transparent 40%);
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .season-badge {
            display: inline-block;
            margin-top: 6px;
            padding: 4px 12px;
            background: rgba(255, 0, 127, 0.15);
            border: 1px solid var(--neon-magenta);
            border-radius: 20px;
            font-size: 0.75rem;
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-magenta);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-cyber);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .pool-stats {
            text-align: center;
        }

        .pool-amount {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--neon-green);
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
            margin: 8px 0;
        }

        .progress-bar-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            height: 10px;
            overflow: hidden;
            margin: 14px 0 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green));
            height: 100%;
            width: 0%;
            transition: width 0.6s ease;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
        }

        .stat-value {
            font-size: 1rem;
            font-weight: 600;
            margin-top: 4px;
            color: var(--text-main);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-cyan), #0077ff);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-cyber);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            margin-top: 8px;
            outline: none;
        }

        input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--neon-cyan);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tickets-list, .history-list {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 8px;
        }

        .ticket-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            border-left: 3px solid var(--neon-cyan);
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 3px solid rgba(0, 240, 255, 0.1);
            border-top-color: var(--neon-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(13, 15, 28, 0.95);
            border: 1px solid var(--neon-cyan);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            transition: transform 0.3s ease;
            z-index: 1000;
            text-align: center;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div id="loader" class="loading-overlay">
        <div class="spinner"></div>
        <p style="margin-top: 16px; font-family: 'Orbitron'; font-size: 0.85rem; color: var(--neon-cyan);">CONNECTING CYBER CORE...</p>
    </div>

    <div class="container">
        <header>
            <h1>POOL TICKETS</h1>
            <div id="seasonBadge" class="season-badge">SEASON #1</div>
        </header>

        <!-- Pool Status Card -->
        <div class="card pool-stats">
            <div class="stat-label">Active Prize Pool</div>
            <div id="totalCollected" class="pool-amount">$530.00</div>
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted);">
                <span>Goal: $<span id="targetGoal">2000</span></span>
                <span>Grand Prize (70%): $<span id="prizePool">371.00</span></span>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Countdown</div>
                    <div id="countdownTimer" class="stat-value">Active Pool</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Your Tickets</div>
                    <div id="myTicketCount" class="stat-value">0</div>
                </div>
            </div>
        </div>

        <!-- Buy Ticket Card (CryptoBot Integration) -->
        <div class="card">
            <div class="section-title">⚡ Instant Entry</div>
            <label style="font-size: 0.8rem; color: var(--text-muted);">Number of Tickets (1 USDT each)</label>
            <input type="number" id="ticketAmount" value="1" min="1" max="50">
            <button class="btn btn-primary" onclick="createInvoice()">Pay with CryptoBot</button>
        </div>

        <!-- Manual TXID Verification Card -->
        <div class="card">
            <div class="section-title">🔍 Verify BEP20 TxID</div>
            <input type="text" id="txHashInput" placeholder="0x... (Transaction Hash)">
            <button class="btn btn-secondary" onclick="verifyTx()">Claim via TxID</button>
        </div>

        <!-- Wallet Settings Card -->
        <div class="card">
            <div class="section-title">🛡️ Payout Wallet (BEP20)</div>
            <input type="text" id="walletInput" placeholder="0x... Your personal wallet">
            <button class="btn btn-secondary" onclick="saveWallet()">Save Wallet</button>
        </div>

        <!-- My Tickets & History -->
        <div class="card">
            <div class="section-title">🎟️ My Active Tickets</div>
            <div id="myTicketsList" class="tickets-list">
                <div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 10px;">No tickets yet</div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Action completed successfully</div>

    <script>
        const API_BASE = "https://pool-tickets-backend.onrender.com";
        let tg = window.Telegram.WebApp;
        tg.expand();

        let userId = tg.initDataUnsafe?.user?.id || 123456789; // Fallback pour test web

        async function fetchState() {
            try {
                let res = await fetch(`${API_BASE}/api/state?user_id=${userId}`);
                let data = await res.json();

                document.getElementById("seasonBadge").innerText = `SEASON #${data.season}`;
                document.getElementById("totalCollected").innerText = `$${data.total_collected.toFixed(2)}`;
                document.getElementById("targetGoal").innerText = data.target_goal;
                document.getElementById("prizePool").innerText = data.prize_pool.toFixed(2);
                
                let percent = Math.min(100, (data.total_collected / data.target_goal) * 100);
                document.getElementById("progressBar").style.width = `${percent}%`;

                document.getElementById("myTicketCount").innerText = data.my_tickets.length;

                if (data.payout_address) {
                    document.getElementById("walletInput").value = data.payout_address;
                }

                let ticketsHtml = "";
                if (data.my_tickets.length === 0) {
                    ticketsHtml = '<div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 10px;">No tickets yet</div>';
                } else {
                    data.my_tickets.forEach(t => {
                        ticketsHtml += `<div class="ticket-item"><span>${t.code}</span><span style="color:var(--neon-cyan)">${t.source}</span></div>`;
                    });
                }
                document.getElementById("myTicketsList").innerHTML = ticketsHtml;

                document.getElementById("loader").style.opacity = "0";
                setTimeout(() => document.getElementById("loader").style.display = "none", 400);
            } catch (err) {
                console.error("State fetch error:", err);
                showToast("Error connecting to server");
            }
        }

        async function createInvoice() {
            let amount = document.getElementById("ticketAmount").value;
            showToast("Generating CryptoBot invoice...");
            try {
                let res = await fetch(`${API_BASE}/api/create-invoice`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: userId, amount: parseFloat(amount) })
                });
                let data = await res.json();
                if (data.ok && data.invoice_url) {
                    window.open(data.invoice_url, '_blank');
                } else {
                    showToast(data.error || "Failed to create invoice");
                }
            } catch (err) {
                showToast("Network error creating invoice");
            }
        }

        async function verifyTx() {
            let txHash = document.getElementById("txHashInput").value.trim();
            if (!txHash) {
                showToast("Please enter a transaction hash");
                return;
            }
            showToast("Verifying blockchain transaction...");
            try {
                let res = await fetch(`${API_BASE}/api/verify-tx`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: userId, tx_hash: txHash })
                });
                let data = await res.json();
                if (data.ok) {
                    showToast(`Success! ${data.tickets_issued} ticket(s) issued!`);
                    document.getElementById("txHashInput").value = "";
                    fetchState();
                } else {
                    showToast(data.error || "Verification failed");
                }
            } catch (err) {
                showToast("Network error verifying transaction");
            }
        }

        async function saveWallet() {
            let address = document.getElementById("walletInput").value.trim();
            try {
                let res = await fetch(`${API_BASE}/api/save-wallet`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: userId, address: address })
                });
                let data = await res.json();
                if (data.ok) {
                    showToast("Wallet saved successfully!");
                } else {
                    showToast(data.error || "Invalid address");
                }
            } catch (err) {
                showToast("Network error saving wallet");
            }
        }

        function showToast(msg) {
            let t = document.getElementById("toast");
            t.innerText = msg;
            t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 3000);
        }

        setInterval(fetchState, 15000);
        fetchState();
    </script>
</body>
</html>
